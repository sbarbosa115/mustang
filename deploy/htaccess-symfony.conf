# >>> mustang front controller >>>
# Added by deploy/cpanel-update.sh after cPanel's own lines (the PHP handler). Edit deploy/htaccess-symfony.conf,
# never this block: the next deploy swaps it for that file.
DirectoryIndex index.php

<IfModule mod_negotiation.c>
    Options -MultiViews
</IfModule>
Options -Indexes

<IfModule mod_rewrite.c>
    RewriteEngine On

    # The base of this directory, so the rules work whether the app sits at the domain's root or below it.
    RewriteCond %{REQUEST_URI}::$0 ^(/.+)/(.*)::\2$
    RewriteRule .* - [E=BASE:%1]

    # Apache drops the Authorization header before PHP sees it; keep it.
    RewriteCond %{HTTP:Authorization} .+
    RewriteRule ^ - [E=HTTP_AUTHORIZATION:%0]

    # /index.php/x and /x are the same page: send the first to the second.
    RewriteCond %{ENV:REDIRECT_STATUS} =""
    RewriteRule ^index\.php(?:/(.*)|$) %{ENV:BASE}/$1 [R=301,L]

    # A file that exists (the UI build, the sample spreadsheets) is served as it is; everything else goes to Symfony.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ %{ENV:BASE}/index.php [L]
</IfModule>

<IfModule !mod_rewrite.c>
    <IfModule mod_alias.c>
        RedirectMatch 307 ^/$ /index.php/
    </IfModule>
</IfModule>

# Apache is the TLS end on cPanel, so it sends HSTS: browsers then never try the site over plain http again.
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS
</IfModule>

# The build's file names carry a hash of their content, so a browser may keep them for a year.
<IfModule mod_headers.c>
    <FilesMatch "\.(js|css|woff2?|svg|png)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</IfModule>

# Vite's manifest and the source maps are for the server, not for visitors.
<IfModule mod_rewrite.c>
    RewriteRule ^build/\.vite/ - [F,L]
    RewriteRule \.map$ - [F,L]
</IfModule>
# <<< mustang front controller <<<
