name: ${COMPOSE_PROJECT_NAME:-mustang}

x-app: &app
  build:
    context: docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  working_dir: /app
  volumes:
    - ./backend:/app
  env_file:
    - path: .env
      required: false
  depends_on:
    database:
      condition: service_healthy

services:
  php:
    <<: *app
    cpus: ${PHP_CPUS:-2}

  worker:
    <<: *app
    command: ["sh", "-c", "until [ -f vendor/autoload.php ]; do sleep 5; done; exec php bin/console messenger:consume async mail --time-limit=3600 -vv"]
    restart: unless-stopped
    cpus: ${WORKER_CPUS:-1}

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./backend:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - php
    cpus: ${NGINX_CPUS:-0.5}

  database:
    image: mariadb:10.11.19
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: mustang
      MARIADB_USER: mustang
      MARIADB_PASSWORD: mustang
    volumes:
      - database:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    cpus: ${DB_CPUS:-1}

  node:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      UI_WATCH: ${UI_WATCH:-1}
    volumes:
      - ./backend:/app
      - ./docker/node/start.sh:/usr/local/bin/start.sh:ro
    command: ["start.sh"]
    cpus: ${NODE_CPUS:-2}

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    cpus: ${MAILPIT_CPUS:-0.25}

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      E2E_BASE_URL: http://nginx
      MAILPIT_URL: http://mailpit:8025
      HOME: /tmp
    ipc: host
    depends_on:
      - nginx
      - mailpit

volumes:
  database:
